---
name: Publish NPM Package
on:
  workflow_dispatch:
  workflow_run:
    workflows: [goreleaser]
    types:
      - completed

permissions:
  contents: read
  # Required to mint the OIDC token that npm trusted publishing exchanges for a
  # short-lived publish credential (cf. https://docs.npmjs.com/trusted-publishers)
  id-token: write

jobs:
  publish_npm:
    name: Publish NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # The release tag is not necessarily the branch tip: workflow_run hands
          # us the default branch, and a manual re-run happens after later merges.
          # A shallow clone leaves the tag unreachable, so fetch the full history.
          fetch-depth: 0
      - name: Check out the release tag
        # Publish the tagged tree rather than whatever has landed on master since.
        run: git checkout --detach "$(git describe --tags --abbrev=0 --match='v*.*.*')"
      - name: Install node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1, which is
          # stricter than the engines range in ./bdist/js/package.json.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        working-directory: ./bdist/js
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Set package version
        working-directory: ./bdist/js
        run: npm version from-git --no-git-tag-version
      # No NPM_TOKEN needed: the package is published through a trusted publisher
      # configured on npmjs.com for this repository and workflow file name.
      # Provenance is attached automatically, so do not pass --provenance.
      - name: Publish NPM package
        working-directory: ./bdist/js
        run: npm publish
