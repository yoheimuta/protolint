---
name: Publish Wheel Package
on:
  workflow_dispatch:
  workflow_run:
    workflows: [goreleaser]
    types:
      - completed

jobs:
  publish_whl:
    name: Publish Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          # The release tag is not necessarily the branch tip: workflow_run hands
          # us the default branch, and a manual re-run happens after later merges.
          # A shallow clone leaves the tag unreachable, so fetch the full history.
          fetch-depth: 0
      - name: Check out the release tag
        # Build and pack the tagged tree rather than whatever has landed on master
        # since. setup.py derives the wheel version from `git describe --tag`.
        run: git checkout --detach "$(git describe --tags --abbrev=0 --match='v*.*.*')"
      - name: Run go release to create binaries
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --clean
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Twine
        run: python -m pip install twine
      - name: Pack WHEEL Package
        working-directory: ./bdist/py
        run: python3 setup.py
      - name: Check WHEEL Packages
        working-directory: ./bdist/py
        run: twine check _wheel/*
      - name: Issue warning if TWINE_USERNAME and TWINE_PASSWORD are not set
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_AUTH_TOKEN }}
        run: |
          echo -n "::warning title=Missing authentication token::In order to publish an wheel package, you must set "
          echo "the PYPI_USERNAME and PYPI_AUTH_TOKEN secrets"
        if: ${{ (env.TWINE_USERNAME == '') || (env.TWINE_PASSWORD == '') }}
      - name: Publish WHEEL package
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_AUTH_TOKEN }}
        run: twine upload _wheel/*
        working-directory: ./bdist/py
        if: ${{ (env.TWINE_USERNAME != '') && (env.TWINE_PASSWORD != '') }}
